<rect x="280" y="135" width="175" height="62" class="accent"/><text x="367.5" y="174" text-anchor="middle" class="label">Client-Stub</text>
<rect x="515" y="135" width="150" height="62" class="accent"/><text x="590.0" y="174" text-anchor="middle" class="label">Netzwerk</text>
<rect x="735" y="135" width="210" height="62" class="accent"/><text x="840.0" y="174" text-anchor="middle" class="label">Server-Skeleton</text>
<rect x="1020" y="135" width="140" height="62" class="accent"/><text x="1090.0" y="174" text-anchor="middle" class="label">Server</text>
<line x1="215" y1="166" x2="272" y2="166" class="msg"/><text x="247.5" y="125" text-anchor="middle" class="tiny">1. Aufruf</text>
<line x1="455" y1="166" x2="507" y2="166" class="msg"/><text x="485.0" y="125" text-anchor="middle" class="tiny">2. Request</text>
<line x1="665" y1="166" x2="727" y2="166" class="msg"/><text x="700.0" y="125" text-anchor="middle" class="tiny">3. Request</text>
<line x1="945" y1="166" x2="1012" y2="166" class="msg"/><text x="982.5" y="125" text-anchor="middle" class="tiny">4. Methodenaufruf</text>
<line x1="1020" y1="258" x2="945" y2="258" class="msg"/><text x="982.5" y="297" text-anchor="middle" class="tiny">5. Ergebnis</text>
