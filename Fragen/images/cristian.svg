<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
  </marker>
  <style>
    .title { font: 700 28px Arial, sans-serif; fill:#111; }
    .label { font: 600 21px Arial, sans-serif; fill:#111; }
    .small { font: 18px Arial, sans-serif; fill:#222; }
    .tiny { font: 15px Arial, sans-serif; fill:#333; }
    .line { stroke:#222; stroke-width:2.2; }
    .msg { stroke:#222; stroke-width:2.2; marker-end:url(#arrow); }
    .box { fill:#f7f9fb; stroke:#222; stroke-width:2; rx:10; }
    .accent { fill:#eaf3fb; stroke:#222; stroke-width:2; rx:10; }
  </style>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="600.0" y="42" text-anchor="middle" class="title">Cristian: Uhrensynchronisierung</text>
<text x="40" y="112.0" class="label">Server</text>
<line x1="170" y1="105.0" x2="1155" y2="105.0" class="line"/>
<text x="40" y="307.0" class="label">Client</text>
<line x1="170" y1="300.0" x2="1155" y2="300.0" class="line"/>
<line x1="260" y1="300.0" x2="470" y2="105.0" class="msg"/>
<text x="365.0" y="193.5" text-anchor="middle" class="tiny">1. Anfrage, Startzeit t₀</text>
<line x1="560" y1="105.0" x2="760" y2="300.0" class="msg"/>
<text x="660.0" y="193.5" text-anchor="middle" class="tiny">2. Antwort mit Serverzeit tₛ</text>
<text x="600" y="320" text-anchor="middle" class="small">Client misst RTT t und setzt die Uhr näherungsweise auf tₛ + t/2.</text></svg>
