<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
  </marker>
  <style>
    .title { font: 700 28px Arial, sans-serif; fill:#111; }
    .label { font: 600 21px Arial, sans-serif; fill:#111; }
    .small { font: 18px Arial, sans-serif; fill:#222; }
    .tiny { font: 15px Arial, sans-serif; fill:#333; }
    .line { stroke:#222; stroke-width:2.2; }
    .msg { stroke:#222; stroke-width:2.2; marker-end:url(#arrow); }
    .box { fill:#f7f9fb; stroke:#222; stroke-width:2; rx:10; }
    .accent { fill:#eaf3fb; stroke:#222; stroke-width:2; rx:10; }
  </style>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="600.0" y="42" text-anchor="middle" class="title">Gegenseitige Authentisierung und Sitzungsschlüssel</text>
<text x="40" y="112.0" class="label">Alice</text>
<line x1="170" y1="105.0" x2="1155" y2="105.0" class="line"/>
<text x="40" y="307.0" class="label">Bob</text>
<line x1="170" y1="300.0" x2="1155" y2="300.0" class="line"/>
<line x1="230" y1="105.0" x2="430" y2="300.0" class="msg"/>
<text x="330.0" y="193.5" text-anchor="middle" class="tiny">E(KB+, A, R_A)</text>
<line x1="500" y1="300.0" x2="700" y2="105.0" class="msg"/>
<text x="600.0" y="193.5" text-anchor="middle" class="tiny">E(KA+, R_A, R_B, K_AB)</text>
<line x1="780" y1="105.0" x2="980" y2="300.0" class="msg"/>
<text x="880.0" y="193.5" text-anchor="middle" class="tiny">E(K_AB, R_B)</text>
<text x="600" y="320" text-anchor="middle" class="small">Danach wird die Nutzkommunikation mit dem Sitzungsschlüssel K_AB verschlüsselt.</text></svg>
