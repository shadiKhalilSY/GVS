<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
  </marker>
  <style>
    .title { font: 700 28px Arial, sans-serif; fill:#111; }
    .label { font: 600 21px Arial, sans-serif; fill:#111; }
    .small { font: 18px Arial, sans-serif; fill:#222; }
    .tiny { font: 15px Arial, sans-serif; fill:#333; }
    .line { stroke:#222; stroke-width:2.2; }
    .msg { stroke:#222; stroke-width:2.2; marker-end:url(#arrow); }
    .box { fill:#f7f9fb; stroke:#222; stroke-width:2; rx:10; }
    .accent { fill:#eaf3fb; stroke:#222; stroke-width:2; rx:10; }
  </style>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="600.0" y="42" text-anchor="middle" class="title">Byzantinische Generäle: widersprüchliche Nachrichten eines Verräters</text>
<rect x="105" y="90" width="150" height="60" class="accent"/><text x="180" y="127" text-anchor="middle" class="label">A (Verräter)</text>
<rect x="445" y="130" width="150" height="60" class="box"/><text x="520" y="167" text-anchor="middle" class="label">B</text>
<rect x="445" y="310" width="150" height="60" class="box"/><text x="520" y="347" text-anchor="middle" class="label">C</text>
<rect x="865" y="220" width="150" height="60" class="box"/><text x="940" y="257" text-anchor="middle" class="label">D</text>
<line x1="255" y1="120" x2="440" y2="152" class="msg"/><text x="350.0" y="130.0" class="small">0</text>
<line x1="255" y1="120" x2="440" y2="340" class="msg"/><text x="350.0" y="220.0" class="small">1</text>
<line x1="255" y1="120" x2="860" y2="258" class="msg"/><text x="560.0" y="175.0" class="small">0</text>
<text x="600" y="460" text-anchor="middle" class="small">Ein byzantinisch fehlerhafter Prozess kann verschiedenen Empfängern unterschiedliche Werte senden.</text></svg>
